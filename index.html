<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>静清ARサンプル（モデル切り替え版）</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        #controls {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            z-index: 9999;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;

            pointer-events: auto;
        }

        .button-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        button {
            padding: 10px 13px;
            font-size: 14px;
            border: none;
            border-radius: 7px;
            background: white;
            color: black;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active {
            background: #cccccc;
        }

        button.selected {
            background: #2196f3;
            color: white;
        }

        #status, #rotationDisplay {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 7px 12px;
            border-radius: 7px;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- AR表示 -->
    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;">

        <a-assets timeout="30000">

            <!-- モデル① -->
            <a-asset-item
                id="obj1"
                src="tinker.obj">
            </a-asset-item>

            <a-asset-item
                id="mtl1"
                src="obj.mtl">
            </a-asset-item>

            <!-- モデル② -->
            <a-asset-item
                id="obj2"
                src="tinker2.obj">
            </a-asset-item>

            <a-asset-item
                id="mtl2"
                src="obj2.mtl">
            </a-asset-item>

        </a-assets>

        <!-- マーカーは1つ -->
        <a-marker
            id="marker"
            type="pattern"
            url="sei.patt">

            <!-- 回転グループ -->
            <a-entity id="rotationGroup">

                <!-- モデル① -->
                <a-entity
                    id="model1"
                    obj-model="obj: #obj1; mtl: #mtl1"
                    position="0 0 0"
                    rotation="0 0 0"
                    scale="0.1 0.1 0.1"
                    visible="true">
                </a-entity>

                <!-- モデル② -->
                <a-entity
                    id="model2"
                    obj-model="obj: #obj2; mtl: #mtl2"
                    position="0 0 0"
                    rotation="0 0 0"
                    scale="0.1 0.1 0.1"
                    visible="false">
                </a-entity>

            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <!-- 操作ボタン -->
    <div id="controls">

        <div id="status">
            表示中：モデル①
        </div>

        <!-- モデル切り替え -->
        <div class="button-row">
            <button id="btn1" class="selected"
                    onclick="changeModel(1)">
                モデル①
            </button>

            <button id="btn2"
                    onclick="changeModel(2)">
                モデル②
            </button>
        </div>

        <!-- 回転角度 -->
        <div id="rotationDisplay">
            X: 0°　Y: 0°　Z: 0°
        </div>

        <!-- 回転操作 -->
        <div class="button-row">
            <button onclick="rotateModel('x', -15)">X−</button>
            <button onclick="rotateModel('x', 15)">X＋</button>

            <button onclick="rotateModel('y', -15)">Y−</button>
            <button onclick="rotateModel('y', 15)">Y＋</button>

            <button onclick="rotateModel('z', -15)">Z−</button>
            <button onclick="rotateModel('z', 15)">Z＋</button>
        </div>

        <div class="button-row">

            <button onclick="resetRotation()">
                回転リセット
            </button>

            <button id="autoButton"
                    onclick="toggleAutoRotation()">
                自動回転 OFF
            </button>

        </div>

    </div>

    <script>

        // 現在表示しているモデル
        let currentModel = 1;

        // 回転角度
        let rotation = {
            x: 0,
            y: 0,
            z: 0
        };

        // 自動回転
        let autoRotation = false;

        // モデル切り替え
        function changeModel(number) {

            const model1 = document.getElementById("model1");
            const model2 = document.getElementById("model2");

            model1.setAttribute("visible", number === 1);
            model2.setAttribute("visible", number === 2);

            currentModel = number;

            document.getElementById("status").textContent =
                "表示中：モデル" + (number === 1 ? "①" : "②");

            document.getElementById("btn1").classList.toggle(
                "selected", number === 1
            );

            document.getElementById("btn2").classList.toggle(
                "selected", number === 2
            );
        }

        // 回転操作
        function rotateModel(axis, angle) {

            rotation[axis] += angle;

            updateRotation();
        }

        // 回転反映
        function updateRotation() {

            const group = document.getElementById("rotationGroup");

            group.setAttribute(
                "rotation",
                rotation.x + " " +
                rotation.y + " " +
                rotation.z
            );

            document.getElementById("rotationDisplay").textContent =
                "X: " + Math.round(rotation.x) + "°　" +
                "Y: " + Math.round(rotation.y) + "°　" +
                "Z: " + Math.round(rotation.z) + "°";
        }

        // 回転リセット
        function resetRotation() {

            rotation.x = 0;
            rotation.y = 0;
            rotation.z = 0;

            updateRotation();
        }

        // 自動回転ON・OFF
        function toggleAutoRotation() {

            autoRotation = !autoRotation;

            document.getElementById("autoButton").textContent =
                autoRotation
                    ? "自動回転 ON"
                    : "自動回転 OFF";
        }

        // 自動回転処理
        let previousTime = null;

        function animate(time) {

            if (previousTime === null) {
                previousTime = time;
            }

            const delta = Math.min((time - previousTime) / 1000, 0.1);
            previousTime = time;

            if (autoRotation) {

                rotation.y += 30 * delta;

                updateRotation();
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

    </script>

</body>
</html>
