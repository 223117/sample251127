<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tinkercad AR表示</title>

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

<!-- AR.js -->
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
    body{
        margin:0;
        overflow:hidden;
        font-family:sans-serif;
    }

    #info{
        position:absolute;
        top:10px;
        left:10px;
        z-index:10;
        background:rgba(0,0,0,0.6);
        color:white;
        padding:10px;
        border-radius:10px;
        font-size:14px;
    }

    #buttons{
        position:absolute;
        bottom:10px;
        width:100%;
        display:flex;
        justify-content:center;
        flex-wrap:wrap;
        z-index:10;
    }

    #buttons button{
        margin:4px;
        padding:8px 12px;
        font-size:14px;
        border:none;
        border-radius:8px;
    }
</style>
</head>

<body>

<div id="info">
    Tinkercad ARモデル表示中
</div>

<!-- ARシーン -->
<a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="logarithmicDepthBuffer:true;"
    arjs="sourceType:webcam; debugUIEnabled:false;"
>

    <!-- モデル読み込み -->
    <a-assets>
        <a-asset-item id="objModel" src="tinker.obj"></a-asset-item>
        <a-asset-item id="mtlModel" src="obj.mtl"></a-asset-item>
    </a-assets>

    <!-- 3Dモデル -->
    <a-obj-model
        id="model"
        src="#objModel"
        mtl="#mtlModel"
        position="0 0 -2"
        rotation="0 0 0"
        scale="0.05 0.05 0.05">
    </a-obj-model>

    <!-- カメラ -->
    <a-entity camera></a-entity>

</a-scene>

<!-- 操作ボタン -->
<div id="buttons">

    <button onclick="rotateX()">X回転</button>
    <button onclick="rotateY()">Y回転</button>
    <button onclick="rotateZ()">Z回転</button>

    <button onclick="scaleUp()">拡大</button>
    <button onclick="scaleDown()">縮小</button>

    <button onclick="moveLeft()">←</button>
    <button onclick="moveRight()">→</button>

    <button onclick="moveUp()">↑</button>
    <button onclick="moveDown()">↓</button>

</div>

<script>

const model = document.getElementById("model");

/* ===== 回転 ===== */

function rotateX(){

    let rot = model.getAttribute("rotation");
    rot.x += 15;

    model.setAttribute("rotation", rot);
}

function rotateY(){

    let rot = model.getAttribute("rotation");
    rot.y += 15;

    model.setAttribute("rotation", rot);
}

function rotateZ(){

    let rot = model.getAttribute("rotation");
    rot.z += 15;

    model.setAttribute("rotation", rot);
}

/* ===== 拡大縮小 ===== */

function scaleUp(){

    let scale = model.getAttribute("scale");

    scale.x += 0.01;
    scale.y += 0.01;
    scale.z += 0.01;

    model.setAttribute("scale", scale);
}

function scaleDown(){

    let scale = model.getAttribute("scale");

    scale.x = Math.max(0.01, scale.x - 0.01);
    scale.y = Math.max(0.01, scale.y - 0.01);
    scale.z = Math.max(0.01, scale.z - 0.01);

    model.setAttribute("scale", scale);
}

/* ===== 移動 ===== */

function moveLeft(){

    let pos = model.getAttribute("position");

    pos.x -= 0.1;

    model.setAttribute("position", pos);
}

function moveRight(){

    let pos = model.getAttribute("position");

    pos.x += 0.1;

    model.setAttribute("position", pos);
}

function moveUp(){

    let pos = model.getAttribute("position");

    pos.y += 0.1;

    model.setAttribute("position", pos);
}

function moveDown(){

    let pos = model.getAttribute("position");

    pos.y -= 0.1;

    model.setAttribute("position", pos);
}

</script>

</body>
</html>
