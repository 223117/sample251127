<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>静清ARサンプル（修正版）</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 100;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-size: 14px;
            border-radius: 6px;
            pointer-events: none;
        }

        #controls {
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 100;
        }

        #controls button {
            margin: 4px;
            padding: 10px 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            color: black;
        }
    </style>
</head>

<div id="status">初期化中...</div>

        </a-obj-model>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

    <button id="scaleUp">拡大</button>
    <button id="scaleDown">縮小</button>
    <button id="capture">撮影</button>
</div>
