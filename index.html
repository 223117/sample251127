            font-family: sans-serif;

        #controls {
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        #controls button {
            pointer-events: auto;
            margin: 4px;
            padding: 10px 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            color: black;
        }

        #controls button:active {
            background: #ddd;
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.65);
            color: white;
