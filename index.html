```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カメラ起動テスト</title>

  <style>
    body {
      margin: 0;
      background: #222;
      color: white;
      font-family: sans-serif;
    }

    #status {
      position: fixed;
      z-index: 10;
      top: 10px;
      left: 10px;
      padding: 12px;
      background: black;
      color: white;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #222;
    }
  </style>
</head>
<body>
  <div id="status">カメラ起動前</div>

  <script>
    const status = document.getElementById("status");

    async function startCamera() {
      try {
        status.textContent = "カメラへの接続中...";

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });

        const video = document.createElement("video");
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        video.srcObject = stream;

        document.body.appendChild(video);
        await video.play();

        status.textContent = "カメラ起動成功";
      } catch (error) {
        status.textContent =
          "カメラエラー：" + error.name + " / " + error.message;
        console.error(error);
      }
    }

    if (!navigator.mediaDevices?.getUserMedia) {
      status.textContent =
        "カメラ機能が使えません。HTTPSまたはlocalhostで開いてください。";
    } else {
      startCamera();
    }
  </script>
</body>
</html>
