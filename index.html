```html
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>静清ARサンプル（ワイヤーフレーム）</title>

        <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

        <style>
            body {
                margin: 0;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            #controls {
                position: absolute;
                bottom: 10px;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                max-width: 400px;
            }

            #controls button {
                margin: 5px;
                padding: 8px 15px;
                font-size: 16px;
            }
        </style>
    </head>

    <body>

        <a-scene embedded arjs="debugUIEnabled:false;">

            <a-assets>
                <a-asset-item id="obj" src="tinker.obj"></a-asset-item>
                <a-asset-item id="mtl" src="obj.mtl"></a-asset-item>
            </a-assets>

            <a-marker type="pattern" url="sei.patt">

                <a-obj-model
                    id="model"
                    src="#obj"
                    mtl="#mtl"
                    scale="0.1 0.1 0.1"
                    rotation="90 180 0"
                    position="0 0 0">
                </a-obj-model>

            </a-marker>

            <a-entity camera></a-entity>

        </a-scene>


        <div id="controls">

            <!-- 自動回転 -->
            <button id="toggleRotation">回転</button>

            <!-- 上下左右回転 -->
            <button id="rotateUp">↑</button>
            <button id="rotateDown">↓</button>
            <button id="rotateLeft">←</button>
            <button id="rotateRight">→</button>

            <!-- 拡大・縮小 -->
            <button id="scaleUp">拡大</button>
            <button id="scaleDown">縮小</button>

            <!-- 撮影 -->
            <button id="capture">撮影</button>

        </div>


        <script>

            // =========================
            // 自動回転
            // =========================

            let rotating = false;
            const rotationSpeed = 1;

            const model = document.getElementById('model');

            function rotateModel() {

                if (rotating) {

                    const rotation = model.getAttribute('rotation');

                    rotation.z += rotationSpeed;

                    model.setAttribute('rotation', rotation);
                }

                requestAnimationFrame(rotateModel);
            }


            // 回転開始・停止
            document.getElementById('toggleRotation').addEventListener('click', () => {

                rotating = !rotating;

            });


            // =========================
            // 上下左右の回転
            // =========================

            const manualRotationSpeed = 5;


            // ↑ 上方向
            document.getElementById('rotateUp').addEventListener('click', () => {

                const rotation = model.getAttribute('rotation');

                rotation.x -= manualRotationSpeed;

                model.setAttribute('rotation', rotation);

            });


            // ↓ 下方向
            document.getElementById('rotateDown').addEventListener('click', () => {

                const rotation = model.getAttribute('rotation');

                rotation.x += manualRotationSpeed;

                model.setAttribute('rotation', rotation);

            });


            // ← 左方向
            document.getElementById('rotateLeft').addEventListener('click', () => {

                const rotation = model.getAttribute('rotation');

                rotation.y -= manualRotationSpeed;

                model.setAttribute('rotation', rotation);

            });


            // → 右方向
            document.getElementById('rotateRight').addEventListener('click', () => {

                const rotation = model.getAttribute('rotation');

                rotation.y += manualRotationSpeed;

                model.setAttribute('rotation', rotation);

            });


            // =========================
            // 拡大
            // =========================

            document.getElementById('scaleUp').addEventListener('click', () => {

                const scale = model.getAttribute('scale');

                scale.x += 0.01;
                scale.y += 0.01;
                scale.z += 0.01;

                model.setAttribute('scale', scale);

            });


            // =========================
            // 縮小
            // =========================

            document.getElementById('scaleDown').addEventListener('click', () => {

                const scale = model.getAttribute('scale');

                scale.x = Math.max(0.01, scale.x - 0.01);
                scale.y = Math.max(0.01, scale.y - 0.01);
                scale.z = Math.max(0.01, scale.z - 0.01);

                model.setAttribute('scale', scale);

            });


            // =========================
            // 撮影
            // =========================

            document.getElementById('capture').addEventListener('click', () => {

                const sceneEl = document.querySelector('a-scene');
                const renderer = sceneEl.renderer;
                const video = document.querySelector('video');

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');

                const width = renderer.domElement.width;
                const height = renderer.domElement.height;

                canvas.width = width;
                canvas.height = height;


                // カメラ映像
                if (video && video.readyState === video.HAVE_ENOUGH_DATA) {

                    context.drawImage(video, 0, 0, width, height);

                }


                // 3Dモデル
                renderer.render(sceneEl.object3D, sceneEl.camera);

                context.drawImage(renderer.domElement, 0, 0);


                // 保存
                const dataURL = canvas.toDataURL("image/png");

                const link = document.createElement('a');

                link.href = dataURL;

                link.download = 'screenshot.png';

                link.click();

            });


            // 自動回転開始
            rotateModel();

        </script>

    </body>
</html>
