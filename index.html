<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>静清ARサンプル</title>

<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: sans-serif;
    }

    /* AR画面 */
    a-scene {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 1 !important;
    }

    /* カメラ映像は表示するが、操作を受け取らない */
    video {
        pointer-events: none !important;
    }

    a-scene canvas {
        pointer-events: none !important;
    }

    /* 状態表示 */
    #status {
        position: fixed;
        top: 10px;
        left: 10px;
        right: 10px;
        z-index: 2147483646;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.75);
        color: white;
        border-radius: 6px;
        font-size: 13px;
        pointer-events: none;
    }

    /* 操作パネルを最前面に固定 */
    #controls {
        position: fixed !important;
        bottom: 10px !important;
        left: 0 !important;
        right: 0 !important;
        width: 100%;
        box-sizing: border-box;
        padding: 5px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;

        z-index: 2147483647 !important;
        pointer-events: auto !important;
        isolation: isolate;
    }

    #controls button {
        position: relative;
        z-index: 2147483647 !important;

        min-width: 52px;
        min-height: 48px;
        margin: 4px;
        padding: 10px 13px;

        font-size: 16px;
        color: #111;
        background: white;
        border: 2px solid #555;
        border-radius: 9px;

        cursor: pointer;
        pointer-events: auto !important;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    #controls button:active {
        background: #ccc;
        transform: scale(0.96);
    }
</style>
</head>

<div id="status">カメラを準備しています...</div>

<a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="alpha: true; antialias: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets timeout="15000">
        <a-asset-item id="obj" src="./tinker.obj"></a-asset-item>
        <a-asset-item id="mtl" src="./obj.mtl"></a-asset-item>
    </a-assets>

    <a-marker id="marker" type="pattern" url="./sei.patt">

        <a-entity light="type: ambient; intensity: 1.2"></a-entity>
        <a-entity
            light="type: directional; intensity: 1"
            position="1 2 3">
        </a-entity>

        <a-obj-model
            id="model"
            src="#obj"
            mtl="#mtl"
            position="0 0 0"
            rotation="90 180 0"
            scale="0.025 0.025 0.025">
        </a-obj-model>

    </a-marker>

    <a-entity camera></a-entity>
</a-scene>

<!-- 操作ボタン -->

    <button type="button" id="scaleUp">拡大</button>
    <button type="button" id="scaleDown">縮小</button>
    <button type="button" id="capture">撮影</button>
</div>
