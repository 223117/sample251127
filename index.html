<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>静清AR マーカー認識テスト</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    #status {
      position: fixed;
      z-index: 99999;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 12px;
      color: white;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 8px;
      font-size: 15px;
      pointer-events: none;
    }

    a-scene {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
  </style>
</head>

<body>
  <div id="status">起動中：カメラの準備をしています</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="antialias: true; alpha: true;">

    <a-marker
      id="testMarker"
      type="pattern"
      url="./sei.patt"
      emitevents="true">

      <!-- マーカー認識テスト用の立方体 -->
      <a-box
        position="0 0.5 0"
        color="red"
        material="shader: flat;">
      </a-box>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById("status");
    const marker = document.getElementById("testMarker");
    const scene = document.querySelector("a-scene");

    scene.addEventListener("loaded", () => {
      status.textContent =
        "シーン起動完了：sei.pngをカメラに正面から映してください";
    });

    marker.addEventListener("markerFound", () => {
      status.textContent = "認識成功！ 赤い立方体が表示されるはずです";
    });

    marker.addEventListener("markerLost", () => {
      status.textContent = "マーカーを見失いました。画像を正面に映してください";
    });

    window.addEventListener("error", (event) => {
      status.textContent = "JavaScriptエラー：" + event.message;
    });

    window.addEventListener("unhandledrejection", (event) => {
      status.textContent =
        "読み込みエラー：" + String(event.reason);
    });
  </script>
</body>
</html>
