<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>静清ARサンプル（完成版）</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 13px;
            border-radius: 6px;
            pointer-events: none;
        }

        #controls {
            position: fixed;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            pointer-events: none;
        }

        #controls button {
            pointer-events: auto;
            margin: 4px;
            padding: 10px 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            color: black;
            cursor: pointer;
            touch-action: manipulation;
        }

        #controls button:active {
            background: #ddd;
        }

        /* AR画面を全画面表示 */
        a-scene {
            position: fixed !important;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        a-scene canvas {
            pointer-events: none;
        }
    </style>
</head>
