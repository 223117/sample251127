<!DOCTYPE html>
<html lang="ja">

      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      z-index: 1 !important;
      pointer-events: none !important;
    }

    a-scene canvas {
      pointer-events: none !important;
    }

    video {
      z-index: 0 !important;
    }

    /* 操作パネルを最前面にする */
    #controls {
      position: fixed;
      z-index: 2147483647;
      top: 10px;
      left: 10px;
      width: 190px;
      padding: 10px;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #333;
      border-radius: 10px;
      pointer-events: auto !important;
      touch-action: manipulation;
    }

    #controls button {
      display: block;
      width: 100%;
      min-height: 42px;
      margin: 5px 0;
      padding: 8px;
      font-size: 15px;
      color: #111;
      background: #f0f0f0;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
      pointer-events: auto !important;
      touch-action: manipulation;
      position: relative;
      z-index: 2147483647;
    }

    #controls button:active {
      background: #bde5ff;
    }

    #status {
      position: fixed;
      z-index: 2147483647;
      right: 10px;
      bottom: 10px;
      max-width: 55%;
      padding: 8px;
      color: white;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 5px;
      font-size: 13px;
      pointer-events: none;
    }

    @media (max-width: 500px) {
      #controls {
        width: 150px;

      #controls button {

    }

</head>
